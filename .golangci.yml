version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - copyloopvar
    - dupl
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 14
    lll:
      line-length: 130
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
          - gosec
          - lll
          - prealloc
        path: _test\.go
      - linters:
          - gosec
        path: nacl/secretbox
      - linters:
          - gochecknoinits
        path: hmetrics/onload/init.go
      - linters:
          - gochecknoinits
        path: cmd/s3env/main.go
      - linters:
          - lll
        path: grpc/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/heroku/x
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
